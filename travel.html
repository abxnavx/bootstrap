<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Tours and Travels</h1>
        <br>
        <div id="demo1" class="carousel slide" data-ride="carousel">
            <ul class="carousel-indicators">
                <li data-target="#demo1" data-slide-to="0" class="active"></li>
                <li data-target="#demo1" data-slide-to="1"></li>
                <li data-target="#demo1" data-slide-to="2"></li>
            </ul>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://th.bing.com/th/id/R.52bafc139e7fe21bbf005da53bb4ccf8?rik=AbNM6GIw16YZSQ&riu=http%3a%2f%2fs1.picswalls.com%2fwallpapers%2f2014%2f07%2f28%2fmaldive-islands-background_121001372_121.jpg&ehk=cZI%2bc%2fNFGH1fHd6UF92MnCM5jDN5Oh5jSIUfrGM7rwY%3d&risl=&pid=ImgRaw&r=0"
                        alt="MALDIVES" width="1100" height="500">
                    <div class="carousel-caption">
                        <h4 class="text-white">Book your holidays to maldives for 2 lakh inr for couples</h4>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://i.ytimg.com/vi/qmlRdvrnzRQ/maxresdefault.jpg" alt="BALI" width="1100"
                        height="500">
                    <div class="carousel-caption">
                        <h2 class="text-white">Bali packages for affordable prices</h2>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="https://www.travelandleisure.com/thmb/QK4CuWpFdm2dR3NDznbBQtsAoN0=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/northern-lights-kirkjufell-mountain-snaefellsnes-iceland-ICELANDLIGHTS1218-824f48715748425f828f05aa2a28dfe0.jpg"
                        alt="iceland" width="1100" height="500">
                    <div class="carousel-caption">
                        <h2 class="text-white">The season of northern lights arrived.book your tickets now</h2>
                    </div>
                </div>
            </div>
            <a class="carousel-control-prev" href="#demo1" data-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </a>
            <a class="carousel-control-next" href="#demo1" data-slide="next">
                <span class="carousel-control-next-icon"></span>
            </a>
        </div>

        <br>
        <button type="button" class="btn btn-info" data-toggle="modal" data-target="#myModal">
            Book Now
        </button>
        <div class="modal fade" id="myModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Book you tickets</h4>
                        <button type="button" class="close" data-dismiss="modal">travel booking</button>
                    </div>
                    <div class="modal-body">
                        choose your destination
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
