<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>FEEDBACK FORM</h1>
        <div class="form group mb-3 mt-3">
            <label for="name">NAME</label>
            <input type="text" class="form-control" id="name" placeholder="enter name">
        </div>
        <div class="form group mb-3 mt-3">
            <label for="email">EMAIL</label>
            <input type="email" class="form-control" id="email" placeholder="enter email">
        </div>
        <div class="form-group mb-3 mt-3">
            <label for="comment">Comment:</label>
            <textarea class="form-control" rows="3" id="comment"></textarea>
        </div>
        <div class="input-group mb-3 mt-3">
            <button class="btn btn-primary dropdown-toggle" data-toggle="dropdown">HOW DID YOU REACH US</button>
            <div class="dropdown-menu">
                <a class="dropdown-item" href="#">via instagram ad</a>
                <a class="dropdown-item" href="#">refered by a friend</a>
                <a class="dropdown-item" href="#">by institution</a>
            </div>
        </div>
        <h6>H0W DO YOU RATE US :</h6>
        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " name="optradio"> 1
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " name="optradio">2
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " name="optradio">3
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " name="optradio">4
            </label>
        </div>
        <div class="form-check">
            <label class="form-check-label">
                <input type="radio" class="form-check-input " name="optradio">5
            </label>
        </div>
        <br>
        <button type="submit" class="btn btn-primary form-control">Submit</button>
    </div>
</body>

</html>
